name: Browser CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: browser-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser:
          - firefox
          - chrome

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Build and verify ${{ matrix.browser }} package
        run: npm run package:${{ matrix.browser }}

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: lst-${{ matrix.browser }}-${{ github.sha }}
          path: web-ext-artifacts/lst-${{ matrix.browser }}-*.zip
          if-no-files-found: error
          retention-days: 14
