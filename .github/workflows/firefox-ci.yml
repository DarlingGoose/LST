name: Firefox CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firefox-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-package:
    name: Lint and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Lint and build Firefox package
        run: npm run package

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: lst-firefox-${{ github.sha }}
          path: web-ext-artifacts/lst-firefox-*.zip
          if-no-files-found: error
          retention-days: 14
